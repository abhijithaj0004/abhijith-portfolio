name: abhijith_portfolio
description: "Personal portfolio website for Abhijith AJ, Flutter Developer."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # The resume PDF is served as a static file from web/resume.pdf (see
  # README) rather than declared here as a Flutter asset.
assets:
  - assets/resume/